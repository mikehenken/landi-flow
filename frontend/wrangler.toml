# Cloudflare Workers — Next.js via @opennextjs/cloudflare (staging)
# Deploy: `pnpm worker:build && wrangler deploy`
# URL: https://landi-flow-staging.<subdomain>.workers.dev
name = "landi-flow-staging"
main = ".open-next/worker.js"
account_id = "dd84ae290b8a011725410e223c0ea928"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "landi-flow-staging"

[vars]
# Skip dynamic require of middleware-manifest.json on Workers (OpenNext #1232).
# next-intl middleware is disabled in minimal mode — locale paths must include /en/ prefix.
NEXT_PRIVATE_MINIMAL_MODE = "1"
NEXTJS_ENV = "production"
