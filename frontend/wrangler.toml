# Cloudflare Pages — Next.js via @cloudflare/next-on-pages
# Deploy: `pnpm pages:build && wrangler pages deploy .vercel/output/static --project-name=landi-flow`
name = "landi-flow"
account_id = "dd84ae290b8a011725410e223c0ea928"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
# Public runtime vars are set in Cloudflare Pages dashboard / CI — never commit secrets.
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_SITE_URL,
# NEXT_PUBLIC_ROOT_DOMAIN, NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY, NEXT_PUBLIC_MOCK_AUTH,
# FLOW_API_URL (server-side proxy to API Worker)
