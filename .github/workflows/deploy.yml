# Deploy landi-flow to Cloudflare (staging / production).
#
# Workers: `landi-flow-api`, `landi-flow-mcp` — runtime secrets are set via
# `wrangler secret put` / Cloudflare dashboard (never committed or echoed in CI).
#
# Frontend: Next.js 15 on Cloudflare Workers via @opennextjs/cloudflare (staging).
# Pages path retained locally as legacy; CI deploys Worker `landi-flow-staging`.
#
# Triggers:
#   - push to `develop` → deploy Workers (staging)
#   - workflow_dispatch → optional Workers + optional frontend flag

name: Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Deploy API + MCP Workers
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend Worker (OpenNext staging)
        type: boolean
        default: false

jobs:
  deploy-workers:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workers
        run: |
          pnpm --filter @landi-flow/api-worker typecheck
          pnpm --filter @landi-flow/mcp-worker typecheck

      - name: Deploy API Worker (landi-flow-api)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy

      - name: Deploy MCP Worker (landi-flow-mcp)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/mcp
          command: deploy

      - name: Record worker URLs
        run: |
          echo "## Worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://landi-flow-api.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken' }}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP: https://landi-flow-mcp.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken' }}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: /api/v1/health on API worker" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_frontend &&
      (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped')
    runs-on: ubuntu-latest
    needs: deploy-workers
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    env:
      # Public build-time vars (no secrets). Runtime secrets via wrangler secret put.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://landi-flow-staging.{0}.workers.dev', vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken') }}
      NEXT_PUBLIC_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || format('landi-flow-staging.{0}.workers.dev', vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken') }}
      NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY }}
      NEXT_PUBLIC_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_MOCK_AUTH || 'false' }}
      FLOW_API_URL: ${{ vars.FLOW_API_URL || 'https://landi-flow-api.mikehenken.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @landi-flow/frontend typecheck

      - name: Build for Cloudflare Workers (OpenNext)
        run: pnpm --filter @landi-flow/frontend worker:build

      - name: Deploy frontend Worker (landi-flow-staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Record frontend URL
        run: |
          SUB="${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken' }}"
          echo "## Frontend deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`landi-flow-staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://landi-flow-staging.${SUB}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: \`@opennextjs/cloudflare\` → \`.open-next/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Required Worker secrets (wrangler secret put — names only)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Purpose |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`LIVEBLOCKS_SECRET_KEY\` | Liveblocks auth route |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`SUPABASE_SERVICE_ROLE_KEY\` | Server routes |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Public vars are inlined at build from GitHub repository variables." >> "$GITHUB_STEP_SUMMARY"
