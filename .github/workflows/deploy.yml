# Deploy landi-flow to Cloudflare (staging / production).
#
# Workers: `landi-flow-api`, `landi-flow-mcp` — runtime secrets are set via
# `wrangler secret put` / Cloudflare dashboard (never committed or echoed in CI).
#
# Frontend: Next.js 15 requires `@cloudflare/next-on-pages` or OpenNext before
# Pages deploy is enabled. See docs/setup/DEPLOYMENT.md.
#
# Triggers:
#   - push to `develop` → deploy Workers (staging)
#   - workflow_dispatch → optional Workers + optional frontend flag

name: Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: Deploy API + MCP Workers
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend to Cloudflare Pages (requires next-on-pages adapter)
        type: boolean
        default: false

jobs:
  deploy-workers:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workers
        run: |
          pnpm --filter @landi-flow/api-worker typecheck
          pnpm --filter @landi-flow/mcp-worker typecheck

      - name: Deploy API Worker (landi-flow-api)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy

      - name: Deploy MCP Worker (landi-flow-mcp)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/mcp
          command: deploy

      - name: Record worker URLs
        run: |
          echo "## Worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://landi-flow-api.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken' }}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP: https://landi-flow-mcp.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'mikehenken' }}.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: /api/v1/health on API worker" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_frontend &&
      (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped')
    runs-on: ubuntu-latest
    needs: deploy-workers
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    env:
      # Public build-time vars (no secrets). Server secrets belong in Cloudflare Pages dashboard.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://landi-flow.pages.dev' }}
      NEXT_PUBLIC_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_ROOT_DOMAIN || 'landi-flow.pages.dev' }}
      NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY }}
      NEXT_PUBLIC_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_MOCK_AUTH || 'false' }}
      FLOW_API_URL: ${{ vars.FLOW_API_URL || 'https://landi-flow-api.mikehenken.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @landi-flow/frontend typecheck

      - name: Build for Cloudflare Pages (next-on-pages)
        run: pnpm --filter @landi-flow/frontend pages:build

      - name: Deploy to Cloudflare Pages (landi-flow)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy .vercel/output/static --project-name=landi-flow --commit-dirty=true

      - name: Record frontend URL
        run: |
          echo "## Frontend deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages project: \`landi-flow\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://landi-flow.pages.dev (or custom domain if configured)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: \`@cloudflare/next-on-pages\` → \`.vercel/output/static\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Required Pages environment variables (public only in CI)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variable | Purpose |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_SUPABASE_URL\` | Supabase project URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_SUPABASE_ANON_KEY\` | Supabase anon key |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_SITE_URL\` | Canonical app URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_ROOT_DOMAIN\` | Auth redirect root domain |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY\` | Liveblocks public key |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`NEXT_PUBLIC_MOCK_AUTH\` | \`false\` on staging for 13r HITM |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`FLOW_API_URL\` | API Worker base URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set server-only secrets (\`LIVEBLOCKS_SECRET_KEY\`, \`SUPABASE_SERVICE_ROLE_KEY\`, etc.) in **Cloudflare Pages → Settings → Environment variables** (encrypted), not in this workflow." >> "$GITHUB_STEP_SUMMARY"
